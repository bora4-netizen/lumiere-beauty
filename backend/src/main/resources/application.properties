spring.application.name=lumiere-beauty-api

server.port=8080

# ---- H2 in-memory database -------------------------------------------------
# The database lives inside the JVM and is reset when the app stops.
# For a real deployment switch to MySQL/PostgreSQL, e.g.:
#   spring.datasource.url=jdbc:mysql://localhost:3306/lumiere
#   spring.datasource.username=...
#   spring.datasource.password=...
spring.datasource.url=jdbc:h2:mem:lumiere;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:lumiere)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JWT -------------------------------------------------------------------
# DEV ONLY: fine for training because the database is in-memory.
# For production: move this to an environment variable / secrets manager.
app.jwt.secret=a44352713e6a7dedda211e67dd43b430230a49ff6fdf525b457e75df845692f840db8b44711336aa4720a2b07a4b1dca
# 24 hours
app.jwt.expiration-ms=86400000

# ---- CORS ------------------------------------------------------------------
# Origins allowed to call the API from a browser (the Vite dev server).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:3000

# Serialize BigDecimal prices as plain numbers (92.00 instead of 9.2E+1)
spring.jackson.serialization.write-bigdecimal-as-plain=true
